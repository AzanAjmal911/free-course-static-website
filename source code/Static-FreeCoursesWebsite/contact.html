<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Static-FreeCoursesWebsite</title>
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./contact.css">

  <!-- bootstrap CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>

  <nav class="navbar navbar-expand-lg navbar-light">
    <div class="container-fluid">
      <a class="navbar-brand" href="./index.html"><b><u>FREE COURSES WEBSITE</u></b></a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
        aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link" aria-current="page" href="index.html">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="./allcourses.html">All Courses</a>
          </li>

          <li class="nav-item">
            <a class="nav-link active" href="./contact.html">Contact</a>
          </li>
        </ul>
        <form class="d-flex">
          <input class="form-control me-2" type="search" placeholder="Search Courses" aria-label="Search">
          <button class="btn btn-warning" type="submit">Submit</button>
        </form>
      </div>
    </div>
  </nav>



  <!-- =============================
=============================
============================= -->


  <div id="carouselExampleIndicators" class="carousel slide" data-bs-ride="carousel">
    <div class="carousel-indicators">
      <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="0" class="active"
        aria-current="true" aria-label="Slide 1"></button>
      <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="1"
        aria-label="Slide 2"></button>
      <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="2"
        aria-label="Slide 3"></button>
    </div>
    <div class="carousel-inner">
      <div class="carousel-item active">
        <img src="./assets/contactbg.jpg" class="d-block w-100" alt="bg">
      </div>
     
    </div>
    
  </div>

  <!-- =============================
=============================
============================= -->


<div class="container">
    <div class="form-container">
      <h2 class=" text-center mb-4"><b><u>Feedback Form</u></b></h2>
      <form action="/">
        <div class="mb-3">
          <label for="username" class="form-label">Username</label>
          <input type="text" class="form-control" id="username" placeholder="Enter your username" required>
        </div>
        <div class="mb-3">
          <label for="email" class="form-label">Email address</label>
          <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
        </div>
        <div class="mb-3">
          <label for="phone" class="form-label">Phone Number</label>
          <input type="number" class="form-control" id="phone" placeholder="03xx 12345678" required>
        </div>
        <div class="mb-3">
          <label for="message" class="form-label">Message</label>
          <textarea class="form-control" id="message" rows="4" required placeholder="Your message..."></textarea>
        </div>
        <button type="submit" class="btn btn-warning w-100">Submit Feedback</button>
      </form>
    </div>
  </div>




 <div class="footer bg-warning p-3">
      <div class="container d-flex justify-content-between">

        <div class="footer-left">
          <h4>Copy right 2025 All Reserved</h4>
        </div>

        <div class="footer-right">
          <h4>Design by <u><b>Azan Ajmal Khan</b></u></h4>
        </div>

      </div>
    </div>


</body>
<script src="./script.js"></script>
